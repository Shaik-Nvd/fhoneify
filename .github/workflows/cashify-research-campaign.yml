name: Cashify pricing research campaign (one-time, manual only)

# Hosted, staged Cashify condition-matrix research (docs/CASHIFY_HOSTED_CAMPAIGN.md).
#
# This file keeps the name of the workflow already registered on main so it can
# be dispatched against the research branch (`gh workflow run ... --ref
# codex/cashify-matrix-integration`); it refuses to run from any other ref.
# It never runs on a schedule, never touches ReferencePrice or any database
# (no DATABASE_URL is provided), and never reads the old CASHIFY_SESSION_STATE.
#
# Budget: 1,500 quotation attempts globally, staged 100 / 500 / 1,500
# cumulative. Attempts are charged in the ledger on branch
# research/cashify-hosted-ledger BEFORE collection. Stages advance only after
# a PASS decision recorded from the owner laptop.
#
# Evidence: every attempt is encrypted with the owner's public key on the
# runner; only ciphertext plus a non-sensitive manifest is uploaded, with
# 90-day retention, then downloaded back and re-hashed before the ledger
# counts anything as COMPLETED. Logs never contain prices.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Approved stage (must equal the ledger approvedStage)'
        required: true
        type: choice
        options: ['1', '2', '3']
      max_attempts:
        description: 'Attempts this job may reserve (whole blocks, within the stage cap)'
        required: true
        type: string
        default: '100'
      mode:
        description: 'dry-run = validation only; evidence-selftest = upload/verify a synthetic encrypted record; neither contacts Cashify or writes the ledger'
        required: true
        type: choice
        default: dry-run
        options: [dry-run, evidence-selftest, collect]
      pace_seconds:
        description: 'Pause between quotations (minimum 10)'
        required: false
        type: string
        default: '20'

permissions:
  contents: write   # ledger branch only (research/cashify-hosted-ledger)
  actions: read     # read the uploaded artifact back for verification

concurrency:
  group: cashify-hosted-matrix
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      # Deliberately unreachable: nothing in this job may use a database.
      DATABASE_URL: postgresql://nobody:x@127.0.0.1:1/none
      DIRECT_URL: postgresql://nobody:x@127.0.0.1:1/none
      CASHIFY_SCRAPER_HEADED: 'false'
      RUN_KEY: ${{ github.run_id }}.${{ github.run_attempt }}
      LEDGER: ledger-branch/ledger.json
      HAS_SESSION: ${{ secrets.CASHIFY_RESEARCH_SESSION != '' }}
      IN_STAGE: ${{ inputs.stage }}
      IN_MAX: ${{ inputs.max_attempts }}
      IN_MODE: ${{ inputs.mode }}
      IN_PACE: ${{ inputs.pace_seconds }}
    steps:
      - name: Refuse to run outside the research branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/codex/cashify-matrix-integration" ]; then
            echo "::error::This campaign runs only from codex/cashify-matrix-integration (got $GITHUB_REF)."
            exit 1
          fi
          case "$IN_MAX" in (''|*[!0-9]*) echo "::error::max_attempts must be a positive integer"; exit 1;; esac
          case "$IN_PACE" in (''|*[!0-9]*) echo "::error::pace_seconds must be an integer"; exit 1;; esac

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Offline research tests
        run: |
          npx tsx scripts/test/researchPricing.matrix.test.ts
          npx tsx scripts/test/researchPricing.hosted.test.ts

      - name: Check out the ledger branch
        uses: actions/checkout@v4
        with:
          ref: research/cashify-hosted-ledger
          path: ledger-branch

      - name: Preflight (no Cashify request)
        if: inputs.mode == 'collect' || env.HAS_SESSION == 'true'
        env:
          CASHIFY_RESEARCH_SESSION: ${{ secrets.CASHIFY_RESEARCH_SESSION }}
        run: npx tsx scripts/pricing-research/hosted/run-hosted.ts preflight

      - name: Reserve attempts (charged before collection)
        id: reserve
        run: |
          set -euo pipefail
          ARGS=(reserve --ledger "$LEDGER" --stage "$IN_STAGE" --max-attempts "$IN_MAX" --run-key "$RUN_KEY" --out hosted-out/reservation.json)
          if [ "$IN_MODE" != "collect" ]; then
            npx tsx scripts/pricing-research/hosted/run-hosted.ts "${ARGS[@]}" --dry-run
            exit 0
          fi
          npx tsx scripts/pricing-research/hosted/run-hosted.ts "${ARGS[@]}"
          cd ledger-branch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ledger.json
          git commit -m "Reserve attempts for run $RUN_KEY (stage $IN_STAGE)"
          git push origin HEAD:research/cashify-hosted-ledger
          echo "reserved=true" >> "$GITHUB_OUTPUT"

      - name: Seal a synthetic evidence record (self-test only)
        id: selftest
        if: inputs.mode == 'evidence-selftest'
        run: |
          npx tsx scripts/pricing-research/hosted/run-hosted.ts selftest --out hosted-out
          echo "sealed=true" >> "$GITHUB_OUTPUT"

      - name: Collect reserved blocks
        if: steps.reserve.outputs.reserved == 'true'
        timeout-minutes: 300
        env:
          CASHIFY_RESEARCH_SESSION: ${{ secrets.CASHIFY_RESEARCH_SESSION }}
        run: >-
          npx tsx scripts/pricing-research/hosted/run-hosted.ts collect
          --reservation hosted-out/reservation.json --out hosted-out
          --pace-seconds "$IN_PACE" --max-minutes 280

      - name: Remove session material
        if: always()
        run: rm -rf cashify-sessions hosted-out/plaintext-evidence

      - name: Upload encrypted evidence (90-day retention)
        id: upload
        if: always() && (steps.reserve.outputs.reserved == 'true' || steps.selftest.outputs.sealed == 'true')
        uses: actions/upload-artifact@v4
        with:
          name: cashify-hosted-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            hosted-out/upload/*.fhc
            hosted-out/upload/manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Read the artifact back and verify hashes
        if: always() && (steps.reserve.outputs.reserved == 'true' || steps.selftest.outputs.sealed == 'true') && steps.upload.outputs.artifact-id != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          npx tsx scripts/pricing-research/hosted/run-hosted.ts verify
          --artifact-id "${{ steps.upload.outputs.artifact-id }}"
          --manifest hosted-out/upload/manifest.json --out hosted-out/verification.json

      - name: Finalize the ledger
        if: always() && steps.reserve.outputs.reserved == 'true'
        run: |
          set -euo pipefail
          npx tsx scripts/pricing-research/hosted/run-hosted.ts finalize --ledger "$LEDGER" --run-key "$RUN_KEY" --verification hosted-out/verification.json
          cd ledger-branch
          git add ledger.json
          git commit -m "Finalize run $RUN_KEY"
          git push origin HEAD:research/cashify-hosted-ledger

      - name: Job summary (no prices)
        if: always() && steps.reserve.outputs.reserved == 'true'
        run: npx tsx scripts/pricing-research/hosted/run-hosted.ts summary --ledger "$LEDGER" --run-key "$RUN_KEY" >> "$GITHUB_STEP_SUMMARY"
