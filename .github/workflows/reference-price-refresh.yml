name: Reference price refresh (Cashify, every 7 days)

# WHY GITHUB ACTIONS AND NOT VERCEL
#
# Fhoneify deploys on Vercel's free plan, where a serverless function is
# capped at 10s (60s on Pro) and cannot keep a Chromium process alive.
# A full-catalog Cashify refresh drives a real browser across ~2,200 device
# pages and takes over an hour, so it cannot live inside a request - and Vercel
# Cron only triggers HTTP requests, so Vercel Cron cannot host it either.
#
# GitHub Actions runs the job on its own runner, off the request path entirely,
# with Chromium available, a 6-hour job limit, and a built-in schedule. On a
# public repository it costs nothing; on a private one this job's ~1.5h/week
# fits inside the 2,000 free minutes/month. No paid service is introduced.

on:
  schedule:
    # 02:30 UTC every Sunday = 08:00 IST, exactly 7 days apart.
    # (A "*/7" day-of-month field would NOT be every 7 days - it resets at the
    # start of each month and would fire twice in three days at month
    # boundaries. Weekly-on-a-fixed-weekday is the only correct 7-day cron.)
    - cron: '30 2 * * 0'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only refresh the first N devices (blank = the whole catalog)'
        required: false
        type: string
      brand:
        description: 'Only refresh one brand (blank = all brands)'
        required: false
        type: string
      dry_run:
        description: 'Run the full pipeline but discard every write'
        required: false
        type: boolean
        default: false

# Phase 9, first line of defence: GitHub will not start a second run of this
# workflow while one is in flight. cancel-in-progress is deliberately FALSE -
# killing a running refresh mid-catalog is worse than making the new run wait.
# (The database lock in lib/referencePricing/refreshLock.ts is the second line,
# and covers runs started from anywhere else, including a laptop.)
concurrency:
  group: reference-price-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Below GitHub's 6h ceiling, and above the job's own internal wall-clock
    # cap (REFRESH_MAX_DURATION_MINUTES) so the job always gets to stop
    # cleanly and write its report rather than being killed mid-device.
    timeout-minutes: 330

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      CASHIFY_SESSION_STATE: ${{ secrets.CASHIFY_SESSION_STATE }}
      REFRESH_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
      REFRESH_CONCURRENCY: '3'
      REFRESH_MAX_RETRIES: '2'
      REFRESH_MAX_DURATION_MINUTES: '300'
      # Never headed on a runner: there is no display, and an unattended job
      # must never be waiting for a human to solve a CAPTCHA.
      CASHIFY_SCRAPER_HEADED: 'false'

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Fail fast if required secrets are missing
        run: |
          missing=""
          [ -z "$DATABASE_URL" ] && missing="$missing DATABASE_URL"
          [ -z "$CASHIFY_SESSION_STATE" ] && missing="$missing CASHIFY_SESSION_STATE"
          if [ -n "$missing" ]; then
            echo "::error::Missing required repository secret(s):$missing"
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Required secrets are present."

      - name: Install dependencies
        # The repo's postinstall already runs `playwright install chromium`;
        # --ignore-scripts would skip it, so it is deliberately not used here.
        run: npm ci

      - name: Install Chromium system dependencies
        run: npx playwright install --with-deps chromium

      - name: Generate the Prisma client
        # generate only. This job never runs `prisma db push` or a migration -
        # a scheduled price refresh must not be able to alter the production
        # schema. Schema changes stay a deliberate, human-run step.
        run: npx prisma generate

      - name: Refresh reference prices from Cashify
        id: refresh
        # Inputs arrive as environment variables, never interpolated into the
        # script body - a `${{ }}` expansion inside `run:` is textual
        # substitution and would let a dispatch input inject shell.
        env:
          INPUT_LIMIT: ${{ inputs.limit }}
          INPUT_BRAND: ${{ inputs.brand }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "$INPUT_LIMIT" ]; then ARGS+=(--limit "$INPUT_LIMIT"); fi
          if [ -n "$INPUT_BRAND" ]; then ARGS+=(--brand "$INPUT_BRAND"); fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then ARGS+=(--dry-run); fi

          set +e
          npm run reference-prices:refresh-cashify -- "${ARGS[@]}" 2>&1 | tee refresh-report.log
          code=${PIPESTATUS[0]}
          set -e

          # 75 = another refresh already held the lock. That is the
          # concurrency guard working correctly, not a broken pipeline, so it
          # must not turn the job red and page someone.
          if [ "$code" = "75" ]; then
            echo "::notice::Another refresh run held the lock; this run exited without touching any prices."
            exit 0
          fi
          exit "$code"

      - name: Publish the refresh report to the job summary
        # Always: a FAILED run is exactly when the report matters most.
        if: always()
        run: |
          {
            echo '## Fhoneify Cashify reference-price refresh'
            echo ''
            echo '```'
            # Only the report block, not the whole log - keeps the summary
            # readable and cannot echo anything from the environment.
            sed -n '/FHONEIFY CASHIFY REFRESH/,$p' refresh-report.log | head -120
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload the full log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-report-${{ github.run_id }}
          path: refresh-report.log
          retention-days: 30
