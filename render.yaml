services:
  - type: web
    name: fhoneify-api
    env: node
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://your-vercel-domain.vercel.app
